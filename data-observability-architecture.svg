<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="550" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="700" letter-spacing="1">DATA OBSERVABILITY DASHBOARD — ARCHITECTURE</text>
  <text x="500" y="70" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="13">Real-time Telemetry Processing, Schema Drift Detection, &amp; Data Quality Engine</text>

  <!-- Flow Connector Lines -->
  <path d="M 230 200 L 310 200" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 490 200 L 570 200" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 750 200 L 830 200" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Flow 1: Data Sources -->
  <g transform="translate(50, 120)">
    <rect width="180" height="160" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="180" height="32" rx="12" fill="url(#cyanGrad)" opacity="0.15"/>
    <text x="90" y="22" text-anchor="middle" fill="#00f2fe" font-family="Inter, sans-serif" font-size="13" font-weight="700">1. DATA SOURCES</text>
    
    <text x="20" y="60" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">• PostgreSQL Tables</text>
    <text x="20" y="85" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">• Sensor Stream (IoT)</text>
    <text x="20" y="110" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">• Order Ingestion Log</text>
    <text x="20" y="135" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">• ML Feature Store</text>
  </g>

  <!-- Flow 2: Ingestion & Telemetry Engine -->
  <g transform="translate(310, 120)">
    <rect width="180" height="160" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
    <text x="90" y="22" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="13" font-weight="700">2. TELEMETRY ENGINE</text>
    
    <text x="20" y="60" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Real-Time Buffer</text>
    <text x="20" y="85" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Latency Tracker (ms)</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Throughput Metric</text>
    <text x="20" y="135" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• SLA Monitor</text>
  </g>

  <!-- Flow 3: Schema Drift & Quality Detector -->
  <g transform="translate(570, 120)">
    <rect width="180" height="160" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="700">3. DRIFT &amp; QUALITY</text>
    
    <text x="20" y="60" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Null Rate Checker</text>
    <text x="20" y="85" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Type Mutation Log</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Quality Dimensions</text>
    <text x="20" y="135" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Alert Generator</text>
  </g>

  <!-- Flow 4: Interactive React Dashboard -->
  <g transform="translate(830, 120)">
    <rect width="120" height="160" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="700">4. DASHBOARD</text>
    
    <text x="15" y="60" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Recharts UI</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Live Stream</text>
    <text x="15" y="110" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• RBAC Toggle</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Vercel Hosted</text>
  </g>

  <!-- Bottom Details Box -->
  <g transform="translate(50, 320)">
    <rect width="900" height="180" rx="12" fill="#0c121e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="30" y="35" fill="#00f2fe" font-family="Inter, sans-serif" font-size="14" font-weight="700">TECHNICAL SPECIFICATIONS &amp; RESUME ALIGNMENT</text>
    
    <text x="30" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12"><tspan font-weight="700" fill="#e2e8f0">Programming Languages:</tspan> JavaScript (ES6+), HTML5, SQL (PostgreSQL &amp; SQLite schema representation)</text>
    <text x="30" y="100" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12"><tspan font-weight="700" fill="#e2e8f0">Web Frameworks &amp; Styling:</tspan> React 18, Vite, Tailwind CSS, Lucide React, Recharts</text>
    <text x="30" y="130" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12"><tspan font-weight="700" fill="#e2e8f0">Deployment &amp; Dev Tools:</tspan> Vercel Deployment, Git/GitHub Version Control</text>
    <text x="30" y="160" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12"><tspan font-weight="700" fill="#e2e8f0">Observability Metrics:</tspan> Ingestion Latency (ms), Pipeline Throughput, Schema Drift Alerting, Data Quality Scoring (Completeness, Uniqueness, Timeliness, Accuracy)</text>
  </g>

</svg>
